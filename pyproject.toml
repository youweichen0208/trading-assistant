[project]
name = "trading-assistant"
version = "0.1.0"
description = "Personal Hermes gateway and restricted platform tools"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx==0.28.1", "trading-core==0.1.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
constraint-dependencies = ["annotated-types==0.7.0", "anyio==4.12.1", "beautifulsoup4==4.15.0", "certifi==2026.5.20", "cffi==2.0.0", "charset-normalizer==3.4.4", "curl-cffi==0.16.3", "h11==0.16.0", "httpcore==1.0.9", "httpx==0.28.1", "idna==3.18", "lxml==6.1.2", "multitasking==0.0.13", "numpy==2.4.3", "pandas==3.0.6", "peewee==4.5.2", "platformdirs==4.12.3", "protobuf==6.33.5", "pycparser==3.0", "pydantic==2.13.4", "pydantic-core==2.46.4", "python-dateutil==2.9.0.post0", "pytz==2025.2", "requests==2.33.0", "six==1.17.0", "soupsieve==2.10", "typing-extensions==4.15.0", "typing-inspection==0.4.2", "tzdata==2025.3", "urllib3==2.7.0", "websockets==15.0.1", "yfinance==1.7.0"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
trading-core = { path = "vendor/trading_core-0.1.0-py3-none-any.whl" }
