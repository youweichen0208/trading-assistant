name: candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed source
        env:
          REVISION: ${{ github.sha }}
        run: docker build --label org.opencontainers.image.revision="$REVISION" -f infra/images/hermes-assistant.Dockerfile -t candidate .
      - name: Verify native tools offline
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=256m -v "$PWD:/verification:ro" --entrypoint python candidate /verification/ops/verify_assistant_native.py /opt/hermes
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=128m -e HOME=/tmp/finance -e HERMES_HOME=/tmp/finance/profile -v "$PWD:/verification:ro" --entrypoint python candidate /verification/ops/verify_finance_runtime.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified candidate
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker tag candidate ghcr.io/youweichen0208/trading-assistant:$REVISION
          docker push ghcr.io/youweichen0208/trading-assistant:$REVISION
