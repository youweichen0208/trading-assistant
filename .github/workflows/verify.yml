name: verify
on: [push, pull_request]
jobs:
  assistant:
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          pip install uv==0.11.16
      - run: uv sync --frozen --group dev --python 3.13.16
      - run: uv run --frozen pytest -q
      - name: Install fixed Hermes in isolated environment
        run: |
          git init /tmp/hermes
          git -C /tmp/hermes remote add origin https://github.com/NousResearch/hermes-agent
          git -C /tmp/hermes fetch --depth 1 origin f97608f178d1ffeca59860195ab7da295f7c8e5f
          git -C /tmp/hermes checkout FETCH_HEAD
          uv sync --project /tmp/hermes --frozen --no-dev --extra messaging --python 3.13.16
          uv pip install --python /tmp/hermes/.venv/bin/python --require-hashes --no-deps -r infra/ddgs-requirements.txt
      - run: /tmp/hermes/.venv/bin/python ops/verify_assistant_native.py /tmp/hermes
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/images/hermes-assistant.Dockerfile -t trading-assistant:ci .
